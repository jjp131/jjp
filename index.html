<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#05070c" />
<title>3D 小场景 · 拖动看一圈</title>
<style>
  html, body {
    margin:0; height:100%; overflow:hidden; background:#05070c;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; touch-action:none; }
  #tip {
    position:fixed; left:0; right:0; top:calc(10px + env(safe-area-inset-top));
    text-align:center; color:#a6b6cb; font-size:13px; line-height:1.75;
    pointer-events:none; text-shadow:0 1px 5px #000; padding:0 16px;
  }
  #tip b { color:#e8f1ff; }
  #tip .sm { color:#6f8199; font-size:12px; }
  .btn {
    position:fixed; z-index:10; background:rgba(24,34,51,.86); color:#cfe0f7;
    border:1px solid #33445e; border-radius:999px; font-size:15px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #fwd {
    right:18px; bottom:calc(26px + env(safe-area-inset-bottom));
    width:104px; height:104px; border-radius:50%; line-height:1.35;
  }
  #fwd:active { background:#2c4162; }
  #card { left:18px; bottom:calc(26px + env(safe-area-inset-bottom)); padding:13px 18px; }
  #quit { right:18px; top:calc(12px + env(safe-area-inset-top)); padding:10px 16px; display:none; }
</style>
</head>
<body>
<div id="tip">
  手指拖动 = 转头 · 按住右下圆钮 = 前进<br />
  <span class="sm">白屏或不动?点右上角 ··· 选「在浏览器打开」</span>
</div>
<button id="fwd" class="btn">↑<br />前进</button>
<button id="card" class="btn">立体模式</button>
<button id="quit" class="btn">退出</button>

<!-- ① three.js 的 UMD 版(非 ES module),微信里最不容易出岔子 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
  // 主 CDN 拉不到(被墙 / 抽风)就换个源再试一次
  if (!window.THREE) {
    document.write('<script src="https://unpkg.com/three@0.147.0/build/three.min.js"><\/script>');
  }
</script>

<!-- ② 场景本体 -->
<script>
(function () {
  'use strict';

  var tipEl = document.getElementById('tip');
  if (!window.THREE) {
    tipEl.innerHTML = '<b>three.js 没加载成功</b><br>检查网络后重新打开一次';
    return;
  }
  var THREE = window.THREE;
  if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;

  /* ---------- 渲染器 ---------- */
  var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));   // 手机卡就改成 1.5
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;        // r147 的写法(新版叫 outputColorSpace)
  renderer.physicallyCorrectLights = true;             // 让点光强度和习惯的数值一致
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  /* ---------- 场景 ---------- */
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070c);
  scene.fog = new THREE.Fog(0x05070c, 16, 60);

  var camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 150);
  camera.rotation.order = 'YXZ';

  var player = { pos: new THREE.Vector3(0, 1.62, 0), yaw: 0, pitch: 0 };

  /* ---------- 灯光 ---------- */
  scene.add(new THREE.HemisphereLight(0x9ec3ff, 0x101826, 0.9));

  var keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
  keyLight.position.set(5, 9, 4);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.bias = -0.0008;
  var sc = keyLight.shadow.camera;
  sc.near = 1; sc.far = 30;
  sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9;
  sc.updateProjectionMatrix();
  scene.add(keyLight);

  var pinkLight = new THREE.PointLight(0xff4fa0, 40, 24, 2);
  pinkLight.position.set(-4, 2.6, -3);
  scene.add(pinkLight);

  var cyanLight = new THREE.PointLight(0x35d0ff, 35, 24, 2);
  cyanLight.position.set(4, 2.2, 3.4);
  scene.add(cyanLight);

  /* ---------- 地面 / 网格 / 星空 ---------- */
  var floor = new THREE.Mesh(
    new THREE.CircleGeometry(16, 64),
    new THREE.MeshStandardMaterial({ color: 0x141a26, roughness: 0.75, metalness: 0.25 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  var grid = new THREE.GridHelper(32, 32, 0x2a3b52, 0x18202e);
  grid.position.y = 0.004;
  grid.material.transparent = true;
  grid.material.opacity = 0.55;
  scene.add(grid);

  (function () {
    var N = 900, pos = new Float32Array(N * 3);
    for (var i = 0; i < N; i++) {
      var v = new THREE.Vector3().randomDirection().multiplyScalar(30 + Math.random() * 20);
      v.y = Math.abs(v.y) * 0.85 + 1.5;
      pos.set([v.x, v.y, v.z], i * 3);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color: 0x9fb6d8, size: 0.18, sizeAttenuation: true,
      transparent: true, opacity: 0.85, depthWrite: false, fog: false
    })));
  })();

  /* ---------- 五个物件,围着你一圈 ---------- */
  var shapes = [];
  function makeShape(geo, color, metal, rough) {
    var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: color, metalness: metal, roughness: rough
    }));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    shapes.push(mesh);
  }
  makeShape(new THREE.TorusKnotGeometry(0.30, 0.10, 160, 24), 0xdfe7f5, 0.95, 0.16);
  makeShape(new THREE.IcosahedronGeometry(0.34, 0), 0x9b8cff, 0.50, 0.28);
  makeShape(new THREE.BoxGeometry(0.45, 0.45, 0.45), 0x35d0ff, 0.50, 0.20);
  makeShape(new THREE.TorusGeometry(0.30, 0.10, 24, 64), 0xffc861, 0.80, 0.25);
  makeShape(new THREE.CapsuleGeometry(0.16, 0.42, 12, 24), 0xff4fa0, 0.40, 0.30);

  shapes.forEach(function (o, i) {
    var a = (i / shapes.length) * Math.PI * 2;
    o.position.set(Math.sin(a) * 1.5, 1.45, Math.cos(a) * 1.5);
    o.userData.baseY = o.position.y;
    o.userData.phase = i * 1.3;
    o.userData.spin = 0.4 + i * 0.12;
  });

  /* ---------- UI ---------- */
  var mode = 'touch';
  var fwdBtn = document.getElementById('fwd');
  var cardBtn = document.getElementById('card');
  var quitBtn = document.getElementById('quit');

  function say(html) { tipEl.innerHTML = html; }

  /* ---------- 触摸:拖动转头 ---------- */
  var dragging = false, lastX = 0, lastY = 0;
  var canvas = renderer.domElement;

  canvas.addEventListener('pointerdown', function (e) {
    if (mode !== 'touch') return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || mode !== 'touch') return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    player.yaw -= dx * 0.005;
    player.pitch -= dy * 0.005;
    player.pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, player.pitch));
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    canvas.addEventListener(ev, function () { dragging = false; });
  });
  canvas.addEventListener('click', function () {
    if (mode === 'cardboard') recenter();
  });

  /* ---------- 按住前进 ---------- */
  var moving = false, speed = 1.6;   // m/s
  fwdBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    moving = true;
    try { fwdBtn.setPointerCapture(e.pointerId); } catch (err) {}
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
    fwdBtn.addEventListener(ev, function () { moving = false; });
  });

  function updateTouch(dt) {
    if (moving) {
      var sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
      player.pos.x -= sin * speed * dt;
      player.pos.z -= cos * speed * dt;
      var r = Math.hypot(player.pos.x, player.pos.z);
      if (r > 12) { player.pos.x *= 12 / r; player.pos.z *= 12 / r; }
    }
    camera.position.copy(player.pos);
    camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  }

  /* ---------- 立体模式:陀螺仪 + 左右分屏 ---------- */
  var IPD = 0.064;   // 瞳距(米),有重影就调这个
  var eyeL = new THREE.PerspectiveCamera(camera.fov, 1, camera.near, camera.far);
  var eyeR = new THREE.PerspectiveCamera(camera.fov, 1, camera.near, camera.far);

  var ZEE = new THREE.Vector3(0, 0, 1);
  var YAXIS = new THREE.Vector3(0, 1, 0);
  var _euler = new THREE.Euler();
  var _q0 = new THREE.Quaternion();
  var _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  var yawOffset = 0;
  var gotOrientation = false;

  function onDeviceOrientation(e) {
    if (e.alpha === null || e.beta === null || e.gamma === null) return;
    gotOrientation = true;
    var alpha = THREE.MathUtils.degToRad(e.alpha);
    var beta = THREE.MathUtils.degToRad(e.beta);
    var gamma = THREE.MathUtils.degToRad(e.gamma);
    var ang = 0;
    if (window.screen && screen.orientation && screen.orientation.angle) ang = screen.orientation.angle;
    else if (typeof window.orientation === 'number') ang = window.orientation;
    var orient = THREE.MathUtils.degToRad(ang);

    _euler.set(beta, alpha, -gamma, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(_q1);
    camera.quaternion.multiply(_q0.setFromAxisAngle(ZEE, -orient));
    if (yawOffset) camera.quaternion.premultiply(_q0.setFromAxisAngle(YAXIS, yawOffset));
  }

  function recenter() {
    var dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    yawOffset -= Math.atan2(-dir.x, -dir.z);
  }

  function renderCardboard() {
    var w = innerWidth, h = innerHeight;
    var halfW = Math.floor(w / 2);
    var off = new THREE.Vector3();

    renderer.setScissorTest(true);
    [eyeL, eyeR].forEach(function (eye, i) {
      var sign = (i === 0) ? -1 : 1;
      off.set(sign * IPD / 2, 0, 0).applyQuaternion(camera.quaternion);
      eye.position.copy(camera.position).add(off);
      eye.quaternion.copy(camera.quaternion);
      eye.fov = camera.fov;
      eye.aspect = halfW / h;
      eye.updateProjectionMatrix();
      eye.updateMatrixWorld();

      var x = i * halfW;
      renderer.setViewport(x, 0, halfW, h);
      renderer.setScissor(x, 0, halfW, h);
      renderer.render(scene, eye);
    });
    renderer.setScissorTest(false);
  }

  function enterCardboard() {
    if (typeof DeviceOrientationEvent === 'undefined') {
      say('这台设备没有方向传感器,分屏看不出立体。<br>用手指拖动玩吧。');
      return;
    }

    var go = function () {
      try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); } catch (e) {}

      window.addEventListener('deviceorientation', onDeviceOrientation);
      mode = 'cardboard';
      yawOffset = 0;
      gotOrientation = false;

      fwdBtn.style.display = 'none';
      cardBtn.style.display = 'none';
      quitBtn.style.display = 'block';
      say('横屏塞进纸盒 · 转头看四周 · 点一下屏幕重新对齐');

      camera.fov = 90;
      camera.updateProjectionMatrix();
      renderer.setRenderTarget(null);
      renderer.setScissorTest(false);
      renderer.setSize(innerWidth, innerHeight);

      // 2 秒后还没收到陀螺仪数据,说明被环境拦了(微信内置浏览器常见)
      setTimeout(function () {
        if (!gotOrientation && mode === 'cardboard') {
          say('拿不到陀螺仪数据 —— 点右上角 ··· 选「在浏览器打开」再试,<br>或退出后用拖动模式。');
        }
      }, 2000);
    };

    // iOS 13+ 必须在用户点击里申请权限
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (res) {
        if (res === 'granted') go();
        else say('陀螺仪权限被拒绝,无法转头。');
      }).catch(function (err) {
        say('陀螺仪权限申请失败:' + err.message);
      });
    } else {
      go();
    }
  }

  function exitCardboard() {
    window.removeEventListener('deviceorientation', onDeviceOrientation);
    mode = 'touch';
    fwdBtn.style.display = 'block';
    cardBtn.style.display = 'block';
    quitBtn.style.display = 'none';
    say('手指拖动 = 转头 · 按住右下圆钮 = 前进');

    camera.fov = 75;
    camera.updateProjectionMatrix();
    camera.rotation.set(0, player.yaw, 0, 'YXZ');

    try { if (document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}

    renderer.setRenderTarget(null);
    renderer.setScissorTest(false);
    renderer.setSize(innerWidth, innerHeight);
  }

  cardBtn.addEventListener('click', enterCardboard);
  quitBtn.addEventListener('click', exitCardboard);

  /* ---------- 主循环 ---------- */
  var clock = new THREE.Clock();
  var t = 0;

  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    t += dt;

    if (mode === 'touch') updateTouch(dt);
    else camera.position.copy(player.pos);

    for (var i = 0; i < shapes.length; i++) {
      var o = shapes[i];
      o.rotation.x += dt * o.userData.spin * 0.6;
      o.rotation.y += dt * o.userData.spin;
      o.position.y = o.userData.baseY + Math.sin(t * 1.1 + o.userData.phase) * 0.06;
    }
    pinkLight.position.set(Math.sin(t * 0.4) * -4.5, 2.6, Math.cos(t * 0.4) * -3.5);
    cyanLight.position.set(Math.sin(t * 0.35 + 2) * 4.5, 2.2, Math.cos(t * 0.35 + 2) * 3.5);

    if (mode === 'cardboard') renderCardboard();
    else renderer.render(scene, camera);
  }
  tick();

  /* ---------- 尺寸变化 ---------- */
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  addEventListener('orientationchange', function () {
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 250);
  });
})();
</script>
</body>
  </html>
